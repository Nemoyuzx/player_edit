<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video Arrow Key Rebind</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <section class="popup-card">
        <p class="eyebrow">Quick Controls</p>
        <h1>播放器快捷设置</h1>
        <p class="summary">直接修改常用参数，数字改完会自动保存。</p>

        <div class="switch-list">
          <label class="switch-row">
            <span>启用扩展</span>
            <input id="enabled" type="checkbox">
          </label>
          <label class="switch-row">
            <span>显示页面提示</span>
            <input id="showOverlay" type="checkbox">
          </label>
        </div>

        <div class="field-list">
          <label>
            <span>短按跳转秒数</span>
            <input id="shortSeekSeconds" type="number" min="1" max="60" step="1" inputmode="numeric">
          </label>

          <label>
            <span>长按判定时间</span>
            <input id="longPressMs" type="number" min="120" max="1200" step="10" inputmode="numeric">
          </label>

          <label>
            <span>右键快进倍速</span>
            <input id="fastForwardRate" type="number" min="1.25" max="16" step="0.25" inputmode="decimal">
          </label>

          <label>
            <span>左键快退倍速</span>
            <input id="fastRewindRate" type="number" min="1.25" max="16" step="0.25" inputmode="decimal">
          </label>

          <label>
            <span>锁定跳转倍率</span>
            <input id="playbackLockSeekMultiplier" type="number" min="1" max="16" step="0.25" inputmode="decimal" placeholder="跟随锁定倍速">
          </label>
        </div>

        <div class="site-preview">
          <div>
            <p class="site-preview-title">当前站点策略</p>
            <p id="site-summary" class="site-preview-text">完整规则请进入设置页编辑</p>
          </div>
        </div>

        <div id="status" class="status" aria-live="polite"></div>

        <div class="button-row">
          <button id="finish-button" type="button" class="primary-button">完成设置</button>
          <button id="reset-button" type="button" class="ghost-button">恢复默认</button>
        </div>

        <button id="open-options-link" type="button" class="text-button">跳转到完整设置</button>
      </section>
    </main>

    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
